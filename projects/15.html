<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מתכונט - שיתוף וחיפוש מתכונים לפי מצרכים עם AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
    body {
      font-family: 'Rubik', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #10b981;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #059669;
    }
    .animate-pulse-slow {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const initialRecipes = [
      {
        id: 1,
        title: "שקשוקה קלאסית עשירה",
        image: "https://images.unsplash.com/photo-1590412200988-a436970781fa?auto=format&fit=crop&w=800&q=80",
        ingredients: ["עגבניות", "ביצים", "שום", "פלפל חריף", "שמן זית", "בצל", "פפריקה מתוקה"],
        instructions: [
          "מטגנים את הבצל והפלפל החריף בשמן זית עד להתרככות והזהבה קלה.",
          "מוסיפים שום קצוץ, עגבניות חתוכות ותבלינים, ומבשלים כ-15 דקות עד לקבלת רוטב סמיך ועשיר.",
          "יוצרים גומות קטנות ברוטב ושוברים לתוכן בעדינות את הביצים.",
          "מכסים את המחבת ומבשלים על אש נמוכה עד שהחלבון מתייצב והחלמון נשאר רך."
        ],
        prepTime: 25,
        difficulty: "קל",
        dietary: ["צמחוני", "ללא גלוטן", "פרווה"],
        chefTip: "מומלץ להגיש עם לחם טרי לטבילה ברוטב העשיר!",
        likes: 14,
        isLiked: false,
        isFavorite: false,
        comments: [
          { id: 1, author: "דניאל", text: "יצא מדהים! הוספתי גם קצת פטרוזיליה וגבינת פטה למעלה." }
        ]
      },
      {
        id: 2,
        title: "פסטה ברוטב עגבניות ובזיליקום",
        image: "https://images.unsplash.com/photo-1621996346565-e3d5d6281316?auto=format&fit=crop&w=800&q=80",
        ingredients: ["פסטה", "עגבניות", "שום", "שמן זית", "בזיליקום"],
        instructions: [
          "מרתיחים מים בסיר גדול עם מלח ומבשלים את הפסטה לפי הוראות היצרן.",
          "במחבת נפרדת, מחממים שמן זית ומטגנים שום קצוץ קלות.",
          "מוסיפים עגבניות מרוסקות ובזיליקום טרי, ומבשלים כ-10 דקות.",
          "מאחדים את הפסטה המבושלת עם הרוטב ומגישים חם."
        ],
        prepTime: 20,
        difficulty: "קל",
        dietary: ["טבעוני", "פרווה"],
        chefTip: "גרדו מעט פרמזן מעל לפני ההגשה למרקם עשיר עוד יותר.",
        likes: 22,
        isLiked: false,
        isFavorite: false,
        comments: []
      },
      {
        id: 3,
        title: "פנקייק אוורירי לבוקר",
        image: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=800&q=80",
        ingredients: ["קמח", "ביצים", "חלב", "סוכר", "חמאה", "אבקת אפייה"],
        instructions: [
          "מערבבים בקערה גדולה קמח, סוכר ואבקת אפייה.",
          "בקערה נפרדת טורפים ביצים, חלב וחמאה מומסת.",
          "מאחדים את החומרים היבשים והרטובים עד לקבלת בלילה אחידה.",
          "יוצקים מחצית מצקת למחבת חמה ומשומנת, והופכים כשמופיעות בועות."
        ],
        prepTime: 15,
        difficulty: "קל",
        dietary: ["צמחוני", "חלבי"],
        chefTip: "אל תערבבו את הבלילה יותר מדי כדי שהפנקייקים יישארו אווריריים.",
        likes: 35,
        isLiked: false,
        isFavorite: false,
        comments: []
      }
    ];

    const POPULAR_INGREDIENTS = [
      "עגבניות", "ביצים", "בצל", "שום", "תפוחי אדמה", "פסטה", "אורז", 
      "חזה עוף", "גבינה צהובה", "טונה", "מלפפון", "גזר", "קמח", "חלב", "שמן זית"
    ];

    const DIETARY_OPTIONS = ["טבעוני", "צמחוני", "ללא גלוטן", "פרווה", "חלבי", "בשרי"];
    const MEAL_TYPES = ["הכל", "ארוחת בוקר", "ארוחת צהריים", "ארוחת ערב", "נשנוש / מאפה", "קינוח"];

    function App() {
      const [activeTab, setActiveTab] = useState('generator'); // 'browse' | 'generator'
      const [recipes, setRecipes] = useState(initialRecipes);

      // AI Chef Generator State
      const [aiIngredients, setAiIngredients] = useState([]);
      const [customIngredientInput, setCustomIngredientInput] = useState('');
      const [selectedMealType, setSelectedMealType] = useState('הכל');
      const [selectedDietaryFilter, setSelectedDietaryFilter] = useState('הכל');
      const [selectedPrepTimeLimit, setSelectedPrepTimeLimit] = useState('30');
      const [isGeneratingAI, setIsGeneratingAI] = useState(false);
      const [generatedAiRecipe, setGeneratedAiRecipe] = useState(null);
      const [aiError, setAiError] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      // Browse Filters State
      const [selectedSearchIngredients, setSelectedSearchIngredients] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDifficulty, setSelectedDifficulty] = useState('הכל');
      const [selectedDietary, setSelectedDietary] = useState('הכל');
      const [maxPrepTime, setMaxPrepTime] = useState('');
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      // Modals
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [activeRecipe, setActiveRecipe] = useState(null);

      // New Manual Recipe Form State
      const [newRecipe, setNewRecipe] = useState({
        title: '',
        image: '',
        ingredients: '',
        instructions: '',
        prepTime: '',
        difficulty: 'קל',
        dietary: []
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      // Add/Remove ingredients for AI Generator
      const handleAddAiIngredient = (ing) => {
        const trimmed = ing.trim();
        if (trimmed && !aiIngredients.includes(trimmed)) {
          setAiIngredients([...aiIngredients, trimmed]);
        }
      };

      const handleRemoveAiIngredient = (ing) => {
        setAiIngredients(aiIngredients.filter(i => i !== ing));
      };

      // Call Gemini API to invent a complete recipe from ingredients
      const generateRecipeWithAI = async () => {
        if (aiIngredients.length === 0) {
          setAiError('אנא בחר או הקלד לפחות מצרך אחד שיש לך בבית.');
          return;
        }

        setIsGeneratingAI(true);
        setAiError('');
        setGeneratedAiRecipe(null);

        // Smart Local Generator Fallback when API key is missing or fails
        const generateFallbackRecipe = () => {
          // Select only 2-4 ingredients for the dish, leave rest as leftovers
          const shuffled = [...aiIngredients].sort(() => 0.5 - Math.random());
          const selectedCount = Math.min(Math.max(2, Math.floor(shuffled.length * 0.6)), 4);
          const selectedForDish = shuffled.slice(0, selectedCount);
          const leftInFridge = shuffled.slice(selectedCount);

          const mainIng = selectedForDish[0] || "מצרך מרכזי";
          const subIng = selectedForDish[1] || "תוספת";

          const recipeTitle = `מאפה/מחבת ${mainIng} ו${subIng} מפנק`;
          
          return {
            id: Date.now(),
            title: recipeTitle,
            description: `ארוחה קלה ומהירה שמבוססת בעיקר על ${selectedForDish.join(' ו-')}. השארנו את שאר הרכיבים במקרר לארוחה הבאה!`,
            image: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=800&q=80",
            ingredients: selectedForDish.map(ing => `חופן/יחידה של ${ing}`),
            leftoverIngredients: leftInFridge,
            instructions: [
              `מכינים ומנקים את ה${selectedForDish.join(' וה-')}.`,
              `מחממים מחבת/תבנית על אש בינונית עם מעט שמן זית או חמאה.`,
              `מוסיפים את ה${mainIng} ומטגנים/מאדים כ-5 דקות עד לריכוך ראשוני.`,
              `משלבים את ${selectedForDish.slice(1).join(', ')} פנימה, מתבלים במלח, פלפל ותבלינים אהובים.`,
              `מבשלים עוד 5-8 דקות על אש קטנה עד שהמנה מוכנה ומשחמת, ומגישים חם!`
            ],
            prepTime: Number(selectedPrepTimeLimit) <= 15 ? 15 : 25,
            difficulty: "קל",
            dietary: [selectedDietaryFilter !== 'הכל' ? selectedDietaryFilter : "מהיר וקל"],
            chefTip: "כדי לשדרג את המנה, מומלץ להוסיף מעט עשבי תיבול טריים או גרידת לימון בסוף הבישול.",
            likes: 1,
            isLiked: false,
            isFavorite: false,
            comments: [
              { id: 1, author: "שף AI", text: "בחרתי במיוחד חלק מהמצרכים כדי שלא תצטרך לרוקן את כל המקרר בבת אחת!" }
            ]
          };
        };

        try {
          const apiKey = ""; // You can insert a Gemini API Key here if available
          
          if (!apiKey) {
            // Simulate short thinking delay and use smart local generator
            setTimeout(() => {
              const recipeData = generateFallbackRecipe();
              setGeneratedAiRecipe(recipeData);
              showToast('✨ השף AI בחר מצרכים והרכיב לך ארוחה!');
              setIsGeneratingAI(false);
            }, 800);
            return;
          }

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const systemPrompt = `אתה שף בינלאומי מקצועי שמומחה בהמצאת מתכונים יצירתיים, טעימים ומדויקים מתוך רשימת מצרכים זמינים.
כלל ברזל חשוב: המשתמש מביא רשימת מצרכים שיש לו במקרר. אל תשתמש בכל המצרכים ביחד במנה אחת! 
בחר רק 3-4 מצרכים בסיסיים ומתאימים כדי להרכיב ארוחה טעימה וקלה אחת, והשאר את שאר המצרכים בצד לארוחות אחרות במקרר.

החזר אך ורק תשובת JSON במבנה המדויק הבא (ללא תגי markdown וללא טקסט נוסף):
{
  "title": "שם המנה היצירתי",
  "description": "תיאור קצר ומעורר תאבון של המנה",
  "prepTime": 20,
  "difficulty": "קל", 
  "dietary": ["צמחוני", "כשר"],
  "ingredients": ["מצרך 1 שנבחר עם כמות", "מצרך 2 שנבחר עם כמות"],
  "leftoverIngredients": ["מצרך 1 שנשאר בצד במקרר", "מצרך 2 שנשאר בצד במקרר"],
  "instructions": [
    "שלב 1 להכנה",
    "שלב 2 להכנה"
  ],
  "chefTip": "טיפ זהב מהשף לשדרוג הטעם"
}`;

          const userPrompt = `יש לי במקרר/במזווה את המצרכים הבאים: ${aiIngredients.join(', ')}.
אני רוצה מתכון מתאים:
- סוג ארוחה: ${selectedMealType}
- הגבלה תזונתית: ${selectedDietaryFilter}
- זמן הכנה מירבי: עד ${selectedPrepTimeLimit} דקות.

חשוב מאוד: אל תערבב את כל המצרכים ביחד! תבחר רק את הרכיבים שהכי מתאימים לארוחה הזו, ותשאיר את השאר בצד במקרר.`;

          const payload = {
            contents: [
              {
                role: "user",
                parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }]
              }
            ],
            generationConfig: {
              responseMimeType: "application/json"
            }
          };

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (jsonText) {
            const parsed = JSON.parse(jsonText);
            const recipeData = {
              id: Date.now(),
              title: parsed.title || "מתכון מיוחד מהשף AI",
              description: parsed.description || "",
              image: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=800&q=80",
              ingredients: parsed.ingredients || [],
              leftoverIngredients: parsed.leftoverIngredients || [],
              instructions: parsed.instructions || [],
              prepTime: parsed.prepTime || 20,
              difficulty: parsed.difficulty || "קל",
              dietary: parsed.dietary || ["AI שף"],
              chefTip: parsed.chefTip || "הגישו חם ותיהנו!",
              likes: 1,
              isLiked: false,
              isFavorite: false,
              comments: [
                { id: 1, author: "שף AI", text: "בחנתי את המקרר שלך ובחרתי רק את המצרכים המתאימים ביותר לארוחה זו!" }
              ]
            };
            setGeneratedAiRecipe(recipeData);
            showToast('✨ השף AI בחר מצרכים והכין לך ארוחה!');
          } else {
            // Fallback if API returned empty
            const recipeData = generateFallbackRecipe();
            setGeneratedAiRecipe(recipeData);
            showToast('✨ השף AI הכין לך ארוחה מותאמת!');
          }
        } catch (err) {
          console.error("AI Generation Error, switching to fallback:", err);
          // Fallback on network error
          const recipeData = generateFallbackRecipe();
          setGeneratedAiRecipe(recipeData);
          showToast('✨ השף AI הכין לך ארוחה מותאמת!');
        } finally {
          setIsGeneratingAI(false);
        }
      };

      // Save generated AI recipe to saved feed
      const saveAiRecipeToCollection = () => {
        if (!generatedAiRecipe) return;
        const exists = recipes.some(r => r.id === generatedAiRecipe.id);
        if (!exists) {
          const savedVersion = { ...generatedAiRecipe, isFavorite: true };
          setRecipes([savedVersion, ...recipes]);
          showToast('📌 המתכון נשמר בהצלחה לרשימת המתכונים שלך!');
        } else {
          showToast('המתכון כבר שמור ברשימה שלך!');
        }
      };

      // Filtered Recipes for Browse tab
      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          if (searchQuery && !r.title.toLowerCase().includes(searchQuery.toLowerCase())) return false;
          if (onlyFavorites && !r.isFavorite) return false;
          if (selectedDifficulty !== 'הכל' && r.difficulty !== selectedDifficulty) return false;
          if (selectedDietary !== 'הכל' && !r.dietary.includes(selectedDietary)) return false;
          if (maxPrepTime && r.prepTime > Number(maxPrepTime)) return false;

          if (selectedSearchIngredients.length > 0) {
            const hasMatches = selectedSearchIngredients.some(ing =>
              r.ingredients.some(rIng => rIng.toLowerCase().includes(ing.toLowerCase()))
            );
            if (!hasMatches) return false;
          }
          return true;
        });
      }, [recipes, searchQuery, selectedSearchIngredients, selectedDifficulty, selectedDietary, maxPrepTime, onlyFavorites]);

      const toggleLike = (id) => {
        setRecipes(recipes.map(r => r.id === id ? { ...r, likes: r.isLiked ? r.likes - 1 : r.likes + 1, isLiked: !r.isLiked } : r));
        if (activeRecipe && activeRecipe.id === id) {
          setActiveRecipe(prev => ({ ...prev, likes: prev.isLiked ? prev.likes - 1 : prev.likes + 1, isLiked: !prev.isLiked }));
        }
      };

      const toggleFavorite = (id) => {
        setRecipes(recipes.map(r => r.id === id ? { ...r, isFavorite: !r.isFavorite } : r));
        if (activeRecipe && activeRecipe.id === id) {
          setActiveRecipe(prev => ({ ...prev, isFavorite: !prev.isFavorite }));
        }
      };

      const handleAddComment = (recipeId, commentText, authorName) => {
        if (!commentText.trim()) return;
        const newCom = { id: Date.now(), author: authorName.trim() || 'אורח/ת', text: commentText.trim() };
        setRecipes(recipes.map(r => r.id === recipeId ? { ...r, comments: [...r.comments, newCom] } : r));
        if (activeRecipe && activeRecipe.id === recipeId) {
          setActiveRecipe(prev => ({ ...prev, comments: [...prev.comments, newCom] }));
        }
      };

      const handleCreateRecipe = (e) => {
        e.preventDefault();
        if (!newRecipe.title || !newRecipe.ingredients || !newRecipe.instructions) return;

        const created = {
          id: Date.now(),
          title: newRecipe.title,
          image: newRecipe.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80',
          ingredients: newRecipe.ingredients.split(',').map(i => i.trim()).filter(Boolean),
          instructions: newRecipe.instructions.split('\n').map(i => i.trim()).filter(Boolean),
          prepTime: Number(newRecipe.prepTime) || 15,
          difficulty: newRecipe.difficulty,
          dietary: newRecipe.dietary,
          chefTip: "מתכון ביתי מקורי ושווה!",
          likes: 0,
          isLiked: false,
          isFavorite: false,
          comments: []
        };

        setRecipes([created, ...recipes]);
        setIsModalOpen(false);
        setNewRecipe({ title: '', image: '', ingredients: '', instructions: '', prepTime: '', difficulty: 'קל', dietary: [] });
        showToast('מתכון חדש פורסם בהצלחה!');
      };

      return (
        <div className="min-h-screen flex flex-col bg-gray-50 text-gray-800">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-2xl shadow-2xl z-50 flex items-center gap-3 text-sm font-bold border border-gray-700 animate-bounce">
              <i className="fa-solid fa-sparkles text-amber-400"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="bg-emerald-600 text-white shadow-md sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center border border-white/20">
                  <i className="fa-solid fa-hat-chef text-xl text-emerald-200"></i>
                </div>
                <div>
                  <h1 className="text-xl font-black tracking-wide leading-none">מתכונט AI</h1>
                  <span className="text-[10px] text-emerald-100 font-medium">שף אישי לפי מצרכים בבית</span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center bg-emerald-700/60 p-1 rounded-xl border border-emerald-500/30 text-xs font-bold">
                <button
                  onClick={() => setActiveTab('generator')}
                  className={`px-3 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer ${activeTab === 'generator' ? 'bg-white text-emerald-800 shadow' : 'text-emerald-100 hover:text-white'}`}
                >
                  <i className="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
                  <span>שף AI מחולל</span>
                </button>
                <button
                  onClick={() => setActiveTab('browse')}
                  className={`px-3 py-2 rounded-lg transition flex items-center gap-1.5 cursor-pointer ${activeTab === 'browse' ? 'bg-white text-emerald-800 shadow' : 'text-emerald-100 hover:text-white'}`}
                >
                  <i className="fa-solid fa-book-open"></i>

                  <i className="fa-solid fa-xmark w-4 h-4 flex items-center justify-center"></i>
                </button>

                <h2 className="text-xl font-black text-gray-800 mb-4">הוספת מתכון חדש</h2>

                <form onSubmit={handleCreateRecipe} className="space-y-3 text-xs font-bold">
                  <div>
                    <label className="block text-gray-700 mb-1">שם המנה</label>
                    <input
                      type="text"
                      required
                      value={newRecipe.title}
                      onChange={e => setNewRecipe({ ...newRecipe, title: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block text-gray-700 mb-1">קישור לתמונה (URL)</label>
                    <input
                      type="url"
                      placeholder="https://..."
                      value={newRecipe.image}
                      onChange={e => setNewRecipe({ ...newRecipe, image: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block text-gray-700 mb-1">מצרכים (מופרדים בפסיקים)</label>
                    <input
                      type="text"
                      required
                      placeholder="קמח, סוכר, ביצים..."
                      value={newRecipe.ingredients}
                      onChange={e => setNewRecipe({ ...newRecipe, ingredients: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-200 rounded-xl"
                    />
                  </div>

                  <div>
                    <label className="block text-gray-700 mb-1">שלבי הכנה (כל שלב בשורה חדשה)</label>
                    <textarea
                      required
                      rows="3"
                      value={newRecipe.instructions}
                      onChange={e => setNewRecipe({ ...newRecipe, instructions: e.target.value })}
                      className="w-full px-3 py-2 border border-gray-200 rounded-xl"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-gray-700 mb-1">זמן הכנה (דקות)</label>
                      <input
                        type="number"
                        required
                        value={newRecipe.prepTime}
                        onChange={e => setNewRecipe({ ...newRecipe, prepTime: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-200 rounded-xl"
                      />
                    </div>
                    <div>
                      <label className="block text-gray-700 mb-1">רמת קושי</label>
                      <select
                        value={newRecipe.difficulty}
                        onChange={e => setNewRecipe({ ...newRecipe, difficulty: e.target.value })}
                        className="w-full px-3 py-2 border border-gray-200 rounded-xl bg-white"
                      >                        <option value="קל">קל</option>
                        <option value="בינוני">בינוני</option>
                        <option value="קשה">קשה</option>
                      </select>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-600 text-white py-3 rounded-xl font-black text-sm hover:bg-emerald-700 transition cursor-pointer mt-2"
                  >
                    פרסם מתכון
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
