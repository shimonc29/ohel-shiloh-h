    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Audio Context Setup for Chords ---
        let audioCtx = null;
        
        const initAudio = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        };

        const playChord = (frequencies) => {
            initAudio();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const duration = 2.5; // זמן דעיכה ארוך יותר לצליל טבעי
            
            frequencies.forEach((freq, i) => {
                if (freq <= 0) return;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.frequency.value = freq;
                
                // אפקט של פריטה (Strumming) - כל מיתר מנוגן בהפרש קטן
                const startTime = now + (i * 0.05);
                
                // שליטה על הווליום והדעיכה (מעטפת הצליל)
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.4, startTime + 0.05); // ווליום חזק יותר מבעבר
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        };

        // --- Classic Guitar Chord Diagram Box Component ---
        const ClassicChordDiagram = ({ chordKey }) => {
            const chord = chordsData[chordKey] || chordsData['Am'];

            return (

        const BeginnerLessonView = ({ onOpenChord }) => {
            const [recording, setRecording] = useState(false);
            const [feedback, setFeedback] = useState(null);

            const toggleRecording = () => {
                if(!recording) {
                    setRecording(true);
                    setFeedback(null);
                    setTimeout(() => {
                        setRecording(false);
                        setFeedback({
                            score: "מצוין! 88%",
                            notes: "קצב מעולה! שים לב להעברה נקייה יותר בין Am ל-Em. שמור על אגודל יציב בגב הצוואר."
                        });
                    }, 4000);
                } else {
                    setRecording(false);
                }
            };

            return (
                <div className="space-y-8 animate-fade-in">
                    {/* Header Banner */}
                    <div className="bg-gradient-to-r from-brand-600 to-indigo-700 text-white p-8 rounded-3xl shadow-lg relative overflow-hidden">
                        <span className="bg-white/20 backdrop-blur-md text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">
                            שיעור ראשון למתחילים
                        </span>
                        <h2 className="text-3xl font-extrabold mb-2">אקורדים ראשונים: Am ו-Em</h2>
                        <p className="text-brand-100 max-w-xl">נלמד 2 אקורדים בסיסיים, נתאמן על פריטה קלה, וננגן את השיר הראשון שלנו בעברית!</p>
                    </div>

                    {/* Section 1: Learn Chords */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <span className="w-7 h-7 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-sm font-bold">1</span>
                            למידת האקורדים
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {['Am', 'Em'].map(chordKey => (
                                <div key={chordKey} className="border border-gray-100 bg-gray-50/50 p-5 rounded-2xl hover:border-brand-300 transition-all">
                                    <div className="flex justify-between items-center mb-3">
                                        <div>
                                            <h4 className="text-2xl font-black text-gray-800">{chordsData[chordKey].name}</h4>
                                            <p className="text-xs text-gray-500">{chordsData[chordKey].hebrewName}</p>
                                        </div>
                                        <button onClick={() => playChord(chordsData[chordKey].freqs)} className="p-3 bg-brand-100 hover:bg-brand-200 text-brand-700 rounded-full transition-all">
                                            <Icons.Play />
                                        </button>
                                    </div>
                                    <button onClick={() => onOpenChord(chordKey)} className="w-full mt-2 bg-white border border-gray-200 hover:border-brand-500 text-brand-600 py-2 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2">
                                        פתח דיאגרמת אקורד מלאה
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Section 2: Song Practice */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <span className="w-7 h-7 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-sm font-bold">2</span>
                            שיר האימון: עוף גוזל (גרסת מתחילים)
                        </h3>
                        <div className="bg-slate-900 text-white p-6 rounded-2xl font-mono space-y-4">
                            <div className="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
                                <span>פריטה מומלצת: ↓   ↓ ↑   ↑ ↓</span>
                                <span>קצב: 70 BPM</span>
                            </div>
                            <div className="space-y-4 text-right dir-rtl font-sans">
                                <div>
                                    <div className="text-brand-400 font-bold tracking-widest font-mono">Am &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Em</div>
                                    <div className="text-lg">הגוזלים שלי עזבו את הקן</div>
                                </div>
                                <div>
                                    <div className="text-brand-400 font-bold tracking-widest font-mono">Am &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Em</div>
                                    <div className="text-lg">פרשו כנפיים ועפו...</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Section 3: Live Feedback */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                        <h3 className="text-xl font-bold text-gray-800 mb-2">אימון ומשוב בלייב</h3>
                        <p className="text-gray-500 text-sm mb-6">לחץ על המיקרופון, נגן 4 תיבות מהשיר וקבל ניתוח מידי של הנגינה והקצב שלך!</p>
                        
                        <button 
                            onClick={toggleRecording} 
                            className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto transition-all ${recording ? 'bg-red-500 text-white recording-active' : 'bg-brand-600 hover:bg-brand-700 text-white shadow-lg hover:scale-105'}`}
                        >
                            <Icons.Mic />
                        </button>
                        <p className="mt-3 text-xs font-bold text-gray-400">
                            {recording ? "מקליט ומנתח נגינה..." : "לחץ להקלטה"}
                        </p>

                        {feedback && (
                            <div className="mt-6 bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-2xl text-right animate-fade-in">
                                <div className="font-bold text-lg mb-1">{feedback.score}</div>
                                <p className="text-sm">{feedback.notes}</p>
                            </div>
                        )}
                    </div>

                    <InteractionBar />
                </div>
            );
        };

        const SongLibraryView = ({ onSelectSong, searchQuery }) => {
            const filteredSongs = hebrewSongsList.filter(song => 
                song.title.includes(searchQuery) || song.artist.includes(searchQuery)
            );

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">ספריית שירים בעברית</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredSongs.map(song => (
                            <div key={song.id} className="bg-white p-6 rounded-2xl border border-gray-100 hover:shadow-lg transition-all flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-start mb-2">
                                        <h3 className="text-xl font-bold text-gray-900">{song.title}</h3>
                                        <span className="bg-brand-50 text-brand-700 text-xs px-2.5 py-1 rounded-full font-bold">{song.level}</span>
                                    </div>
                                    <p className="text-gray-500 text-sm mb-4">{song.artist}</p>
                                    <div className="flex flex-wrap gap-1 mb-4">
                                        {song.chords.map(c => (
                                            <span key={c} className="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded font-mono font-bold">{c}</span>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => onSelectSong(song)} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 rounded-xl transition-colors">
                                    פתח שיר
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const SongDetailView = ({ song, onOpenChord }) => {
            return (
                <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 space-y-8 animate-fade-in">
                    <div className="border-b pb-6">
                        <h2 className="text-3xl font-extrabold text-gray-900 mb-1">{song.title}</h2>
                        <p className="text-lg text-gray-500">{song.artist}</p>
                        <div className="flex flex-wrap gap-4 mt-4 text-sm text-gray-600">
                            <span className="bg-gray-100 px-3 py-1 rounded-lg">קאפו: <strong>{song.capo}</strong></span>
                            <span className="bg-gray-100 px-3 py-1 rounded-lg">פריטה: <strong>{song.strum}</strong></span>
                        </div>
                    </div>

                    {/* Chord Bar */}
                    <div>
                        <h4 className="text-sm font-bold text-gray-400 mb-2">אקורדים בשיר (לחץ לצפייה בדיאגרמה):</h4>
                        <div className="flex flex-wrap gap-2">
                            {song.chords.map(c => (
                                <button key={c} onClick={() => onOpenChord(c)} className="bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold px-4 py-2 rounded-xl text-lg font-mono transition-all border border-brand-200">
                                    {c}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Song Chords & Lyrics Content */}
                    <div className="space-y-8">
                        {song.content.map((sec, i) => (
                            <div key={i} className="space-y-4">
                                <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider">{sec.title}</h4>
                                <div className="space-y-4">
                                    {sec.lines.map((line, j) => (
                                        <div key={j} className="space-y-1">
                                            <button onClick={() => onOpenChord(line.chord)} className="text-brand-600 font-bold font-mono text-sm hover:underline">
                                                {line.chord}
                                            </button>
                                            <div className="text-lg text-gray-800">{line.text}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <InteractionBar />
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('beginner'); // 'beginner', 'library', 'song'
            const [selectedSong, setSelectedSong] = useState(null);
            const [selectedChordModal, setSelectedChordModal] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            const handleSelectSong = (song) => {
                setSelectedSong(song);
                setActiveTab('song');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Nav */}
                    <header className="bg-white border-b border-gray-100 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center justify-between w-full md:w-auto">
                                <h1 onClick={() => setActiveTab('beginner')} className="text-2xl font-black text-brand-600 cursor-pointer tracking-tight">
                                    GuitarFlow <span className="text-xs bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-normal">בעברית</span>
                                </h1>
                            </div>

                            {/* Search Bar */}
                            <div className="relative w-full md:w-80">
                                <input 
                                    type="text" 
                                    placeholder="חפש שיר או אמן..."
                                    value={searchQuery}
                                    onChange={(e) => {
                                        setSearchQuery(e.target.value);
                                        if(activeTab !== 'library') setActiveTab('library');
                                    }}
                                    className="w-full bg-gray-50 border border-gray-200 rounded-full py-2 pr-10 pl-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 text-right"
                                />
                                <span className="absolute right-3 top-2.5 text-gray-400">
                                    <Icons.Search />
                                </span>
                            </div>

                            {/* Nav Buttons */}
                            <nav className="flex items-center gap-2 w-full md:w-auto justify-center">
                                <button 
                                    onClick={() => setActiveTab('beginner')} 
                                    className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${activeTab === 'beginner' ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    מסלול מתחילים
                                </button>
                                <button 
                                    onClick={() => setActiveTab('library')} 
                                    className={`px-4 py-2 rounded-full text-sm font-bold transition-all ${activeTab === 'library' ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-100'}`}
                                >
                                    ספריית שירים
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6">
                        {activeTab === 'beginner' && <BeginnerLessonView onOpenChord={setSelectedChordModal} />}
                        {activeTab === 'library' && <SongLibraryView onSelectSong={handleSelectSong} searchQuery={searchQuery} />}
                        {activeTab === 'song' && selectedSong && <SongDetailView song={selectedSong} onOpenChord={setSelectedChordModal} />}
                    </main>

                    {/* Interactive Modal for Chord Diagram */}
                    {selectedChordModal && (
                        <InteractiveFretboard chordKey={selectedChordModal} onClose={() => setSelectedChordModal(null)} />
                    )}

                    <footer className="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-400 mt-12">
                        GuitarFlow © 2026 - ללמוד לנגן בגיטרה בקצב שלך
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
